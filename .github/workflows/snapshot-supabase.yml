name: Snapshot Supabase aportes

# Trigger manual desde Actions → "Snapshot Supabase aportes" → Run workflow.
# Escribe data/snapshots/aportes.json en master con todo el contenido de la
# tabla aportes (incluyendo pending/flagged si se configuró el service_role).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch aportes from Supabase
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY no está configurado. Usando anon key (solo published)."
            SUPABASE_KEY="sb_publishable_koi9-hs66CawPkABRcMbdw_XkGjpUMD"
          fi
          mkdir -p data/snapshots
          curl -fsS "https://hhbgkwbflrmfgtxwhlia.supabase.co/rest/v1/aportes?select=*&order=created_at.desc" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            | python3 -m json.tool > data/snapshots/aportes.json
          echo "Filas:"
          python3 -c "import json; print(len(json.load(open('data/snapshots/aportes.json'))))"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/aportes.json
          if git diff --cached --quiet; then
            echo "Sin cambios. Nada que commitear."
            exit 0
          fi
          TS=$(date -u +%Y-%m-%dT%H:%MZ)
          git commit -m "snapshot: aportes $TS [skip ci]"
          git push
