name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ph/core typecheck
      - run: pnpm --filter @ph/core test

  sql:
    name: sql migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: phci
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in supabase/test/0000_supabase_stub.sql supabase/migrations/*.sql supabase/seed.sql; do
            echo "--- $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
